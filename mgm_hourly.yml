name: MGM Saat Basi Veri Cekme + Harita + E-posta

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: MGM verisini cek, yas termometre hesapla, harita uret, e-posta gonder
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 mgm_hourly.py

      - name: Sonuclari commit et
        run: |
          git config user.name "mgm-bot"
          git config user.email "actions@github.com"
          git add turkiye_sondurum_wetbulb_latest.csv turkiye_sondurum_wetbulb_log.csv turkiye_islak_termometre_latest.jpg
          git diff --quiet --cached || git commit -m "MGM verisi ve harita guncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
